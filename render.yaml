# Blueprint do Render: API (Docker) + frontend (site estático) + PostgreSQL.
# Render → New → Blueprint → escolha este repositório. Os segredos são gerados automaticamente.
databases:
  - name: leadhunter-db
    plan: free
    databaseName: leadhunter
    user: leadhunter

services:
  - type: web
    name: leadhunter-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Uma instância só: a sessão do WhatsApp e o despachante de mensagens vivem no processo.
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leadhunter-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: leadhunter-web
          property: host
      - key: APP_URL
        fromService:
          type: web
          name: leadhunter-web
          property: host

  - type: web
    name: leadhunter-web
    runtime: static
    buildCommand: npm ci --workspace @leadhunter/web --include-workspace-root=false && npm run build -w @leadhunter/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: leadhunter-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
